name: Sync issues to Playable Project

on:
  issues:
    types:
      - opened
      - reopened
      - closed

permissions:
  contents: read
  issues: read

concurrency:
  group: project-sync-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  sync:
    name: Keep project status synchronized
    runs-on: ubuntu-latest
    steps:
      - name: Add issue and update project fields
        env:
          GH_TOKEN: ${{ secrets.PLAYABLE_PROJECT_TOKEN }}
          ISSUE_ACTION: ${{ github.event.action }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          PROJECT_ID: PVT_kwHODzNVpM4BkFSd
          PROJECT_NUMBER: "14"
          PROJECT_OWNER: phranck
          STATUS_FIELD_ID: PVTSSF_lAHODzNVpM4BkFSdzhi3M24
          STATUS_BACKLOG_ID: cd2c9d67
          STATUS_DONE_ID: f145623b
          PRIORITY_FIELD_ID: PVTSSF_lAHODzNVpM4BkFSdzhi3M3o
          PRIORITY_P2_ID: dee435fa
        run: |
          set -euo pipefail

          item_id="$(gh project item-add "$PROJECT_NUMBER" \
            --owner "$PROJECT_OWNER" \
            --url "$ISSUE_URL" \
            --format json \
            --jq '.id')"

          case "$ISSUE_ACTION" in
            opened)
              status_id="$STATUS_BACKLOG_ID"
              gh project item-edit \
                --id "$item_id" \
                --project-id "$PROJECT_ID" \
                --field-id "$PRIORITY_FIELD_ID" \
                --single-select-option-id "$PRIORITY_P2_ID"
              ;;
            reopened)
              status_id="$STATUS_BACKLOG_ID"
              ;;
            closed)
              status_id="$STATUS_DONE_ID"
              ;;
            *)
              exit 0
              ;;
          esac

          gh project item-edit \
            --id "$item_id" \
            --project-id "$PROJECT_ID" \
            --field-id "$STATUS_FIELD_ID" \
            --single-select-option-id "$status_id"
